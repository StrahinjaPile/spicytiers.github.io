<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SpicyTiers — PvP Leaderboard</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>

<body>

<div class="site">

    <header class="topbar">

        <a href="index.html" class="logo">
            <span>⚡</span> SpicyTiers
        </a>

        <nav>
            <a href="index.html" class="active">Leaderboard</a>
            <a href="admin.html">Admin</a>
        </nav>

    </header>


    <main>

        <section class="hero">

            <div class="hero-content">

                <div class="hero-badge">
                    SPICYTIERS
                </div>

                <h1>
                    Minecraft PvP<br>
                    <span>Leaderboard</span>
                </h1>

                <p>
                    Compete. Rank up. Become the best.
                </p>

            </div>

        </section>


        <section class="leaderboard-section">

            <div class="section-title">

                <div>
                    <div class="small-title">
                        GLOBAL RANKINGS
                    </div>

                    <h2>
                        Leaderboard
                    </h2>
                </div>

                <div class="search-wrapper">
                    <input
                        id="searchInput"
                        type="text"
                        placeholder="Search player..."
                        autocomplete="off"
                    >
                </div>

            </div>


            <div class="gamemode-tabs">

                <button class="mode active" data-mode="sword">
                    ⚔ Sword
                </button>

                <button class="mode" data-mode="axe">
                    🪓 Axe
                </button>

                <button class="mode" data-mode="vanilla">
                    Vanilla
                </button>

                <button class="mode" data-mode="uhc">
                    UHC
                </button>

                <button class="mode" data-mode="smp">
                    SMP
                </button>

                <button class="mode" data-mode="netheriteop">
                    Netherite OP
                </button>

                <button class="mode" data-mode="pot">
                    Pot
                </button>

                <button class="mode" data-mode="mace">
                    Mace
                </button>

            </div>


            <div class="leaderboard">

                <div class="leaderboard-head">
                    <span>#</span>
                    <span>PLAYER</span>
                    <span>TIER</span>
                    <span>ELO</span>
                </div>

                <div id="leaderboardList">

                    <div class="loading">
                        Loading players...
                    </div>

                </div>

            </div>

        </section>

    </main>


    <footer>

        <div>
            ⚡ SpicyTiers
        </div>

        <span>
            Minecraft PvP Ranking System
        </span>

    </footer>

</div>


<script src="firebase-config.js"></script>
<script src="app.js"></script>

</body>
</html>
