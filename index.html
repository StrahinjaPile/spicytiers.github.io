<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SpicyTiers — PvP Leaderboard</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>

<body>

<div class="site">

    <!-- TOPBAR -->

    <header class="topbar">

        <a href="index.html" class="logo">
            <span>⚡</span> SpicyTiers
        </a>

        <nav>
            <a href="index.html" class="active">
                Leaderboard
            </a>

            <a href="admin.html">
                Admin
            </a>
        </nav>

    </header>


    <!-- HERO -->

    <main>

        <section class="hero">

            <div class="hero-glow"></div>

            <div class="hero-content">

                <div class="hero-badge">
                    SPICYTIERS
                </div>

                <h1>
                    Minecraft PvP<br>
                    <span>Leaderboard</span>
                </h1>

                <p>
                    Compete. Rank up. Become the best.
                </p>

            </div>

        </section>


        <!-- LEADERBOARD -->

        <section class="leaderboard-section">

            <div class="leaderboard-top">

                <div class="leaderboard-title">

                    <div class="small-title">
                        GLOBAL LEADERBOARD
                    </div>

                    <h2>
                        Global Rankings
                    </h2>

                </div>


                <!-- GAME MODE SELECTOR -->

                <div class="mode-selector">

                    <div class="mode-label">
                        GAME MODE
                    </div>

                    <button
                        id="modeButton"
                        class="mode-selector-button"
                    >

                        <span id="selectedModeIcon">
                            ⚔
                        </span>

                        <span id="selectedMode">
                            Sword
                        </span>

                        <span class="arrow">
                            ▼
                        </span>

                    </button>


                    <div
                        id="modeDropdown"
                        class="mode-dropdown"
                    >

                        <button
                            class="mode-option active"
                            data-mode="sword"
                            data-name="Sword"
                            data-icon="⚔"
                        >
                            <span>⚔</span>
                            Sword
                        </button>

                        <button
                            class="mode-option"
                            data-mode="axe"
                            data-name="Axe"
                            data-icon="🪓"
                        >
                            <span>🪓</span>
                            Axe
                        </button>

                        <button
                            class="mode-option"
                            data-mode="vanilla"
                            data-name="Vanilla"
                            data-icon="◆"
                        >
                            <span>◆</span>
                            Vanilla
                        </button>

                        <button
                            class="mode-option"
                            data-mode="uhc"
                            data-name="UHC"
                            data-icon="♥"
                        >
                            <span>♥</span>
                            UHC
                        </button>

                        <button
                            class="mode-option"
                            data-mode="smp"
                            data-name="SMP"
                            data-icon="🌲"
                        >
                            <span>🌲</span>
                            SMP
                        </button>

                        <button
                            class="mode-option"
                            data-mode="netheriteop"
                            data-name="Netherite OP"
                            data-icon="◆"
                        >
                            <span>◆</span>
                            Netherite OP
                        </button>

                        <button
                            class="mode-option"
                            data-mode="pot"
                            data-name="Pot"
                            data-icon="⚗"
                        >
                            <span>⚗</span>
                            Pot
                        </button>

                        <button
                            class="mode-option"
                            data-mode="mace"
                            data-name="Mace"
                            data-icon="🔨"
                        >
                            <span>🔨</span>
                            Mace
                        </button>

                    </div>

                </div>

            </div>


            <!-- SEARCH -->

            <div class="leaderboard-tools">

                <div class="current-mode">

                    <span id="currentModeText">
                        ⚔ Sword Rankings
                    </span>

                </div>

                <div class="search-wrapper">

                    <span class="search-icon">
                        ⌕
                    </span>

                    <input
                        id="searchInput"
                        type="text"
                        placeholder="Search player..."
                        autocomplete="off"
                    >

                </div>

            </div>


            <!-- TABLE -->

            <div class="leaderboard">

                <div class="leaderboard-head">

                    <span>#</span>

                    <span>
                        PLAYER
                    </span>

                    <span>
                        TIER
                    </span>

                    <span>
                        ELO
                    </span>

                </div>


                <div id="leaderboardList">

                    <div class="loading">
                        Loading players...
                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        <div>
            ⚡ SpicyTiers
        </div>

        <span>
            Minecraft PvP Ranking System
        </span>

    </footer>

</div>


<script src="firebase-config.js"></script>
<script src="app.js"></script>

</body>
</html>
