<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SpicyTiers Admin</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>

<body>

<div class="site">

    <header class="topbar">

        <a href="index.html" class="logo">
            <span>⚡</span> SpicyTiers
        </a>

        <nav>
            <a href="index.html">Leaderboard</a>
            <a href="admin.html" class="active">Admin</a>
        </nav>

    </header>


    <main class="admin-page">

        <div class="admin-title">

            <div class="small-title">
                SPICYTIERS
            </div>

            <h1>
                Admin Panel
            </h1>

            <p>
                Manage player ELO and tiers.
            </p>

        </div>


        <!-- LOGIN -->

        <div id="loginPanel" class="panel login-box">

            <h2>ADMIN LOGIN</h2>

            <input
                id="email"
                type="email"
                placeholder="Email"
                autocomplete="username"
            >

            <input
                id="password"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
            >

            <button id="loginButton">
                LOGIN
            </button>

            <div id="loginMessage" class="message"></div>

        </div>


        <!-- ACCESS DENIED -->

        <div
            id="deniedPanel"
            class="panel"
            style="display: none;"
        >

            <h2>ACCESS DENIED</h2>

            <p>
                This account is not an administrator.
            </p>

            <button
                id="logoutDenied"
                class="gray-btn"
            >
                LOGOUT
            </button>

        </div>


        <!-- ADMIN -->

        <div
            id="adminPanel"
            style="display: none;"
        >

            <!-- PLAYER EDITOR -->

            <div class="panel">

                <h2>PLAYER EDITOR</h2>

                <div class="form-grid">

                    <div class="form-group">

                        <label>
                            MINECRAFT USERNAME
                        </label>

                        <input
                            id="username"
                            type="text"
                            placeholder="Minecraft Username"
                            maxlength="16"
                            autocomplete="off"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            GAME MODE
                        </label>

                        <select id="gameMode">

                            <option value="sword">
                                Sword
                            </option>

                            <option value="axe">
                                Axe
                            </option>

                            <option value="vanilla">
                                Vanilla
                            </option>

                            <option value="uhc">
                                UHC
                            </option>

                            <option value="smp">
                                SMP
                            </option>

                            <option value="netheriteop">
                                Netherite OP
                            </option>

                            <option value="pot">
                                Pot
                            </option>

                            <option value="mace">
                                Mace
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            ELO
                        </label>

                        <input
                            id="elo"
                            type="number"
                            min="0"
                            placeholder="ELO"
                            autocomplete="off"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            TIER
                        </label>

                        <input
                            id="tier"
                            type="text"
                            value="UNRANKED"
                            readonly
                        >

                    </div>

                </div>


                <div class="admin-buttons">

                    <button
                        id="savePlayer"
                        class="save-btn"
                    >
                        SAVE / UPDATE
                    </button>

                    <button
                        id="deletePlayer"
                        class="delete-btn"
                    >
                        DELETE
                    </button>

                </div>


                <div
                    id="adminMessage"
                    class="message"
                ></div>

            </div>


            <!-- PLAYERS -->

            <div class="panel">

                <h2>ALL PLAYERS</h2>

                <div id="adminPlayerList">
                    Loading...
                </div>

            </div>


            <!-- LOGOUT -->

            <div class="panel">

                <button
                    id="logoutButton"
                    class="gray-btn"
                >
                    LOGOUT
                </button>

                <br><br>

                <a href="index.html">
                    ← Back to Leaderboard
                </a>

            </div>

        </div>

    </main>


    <footer>

        <div>
            ⚡ SpicyTiers
        </div>

        <span>
            Minecraft PvP Ranking System
        </span>

    </footer>

</div>


<script src="firebase-config.js"></script>
<script src="admin.js"></script>

</body>
</html>
