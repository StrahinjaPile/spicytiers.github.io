<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SpicyTiers Admin</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>
            <span class="red">⚡ Spicy</span>Tiers
        </h1>

        <p>Leaderboard Administration</p>
    </div>

    <div id="loginPanel" class="panel">

        <h2>ADMIN LOGIN</h2>

        <input
            id="email"
            type="email"
            placeholder="Email"
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
        >

        <button id="loginButton">
            LOGIN
        </button>

        <div id="loginMessage" class="message"></div>

    </div>

    <div
        id="deniedPanel"
        class="panel"
        style="display: none;"
    >

        <h2>ACCESS DENIED</h2>

        <p>This account is not an administrator.</p>

        <button id="logoutDenied" class="gray">
            LOGOUT
        </button>

    </div>

    <div
        id="adminPanel"
        style="display: none;"
    >

        <div class="panel">

            <h2>PLAYER EDITOR</h2>

            <input
                id="username"
                type="text"
                placeholder="Minecraft Username"
                maxlength="16"
            >

            <input
                id="elo"
                type="number"
                min="0"
                placeholder="ELO"
            >

            <select id="tier">

                <option value="UNRANKED">UNRANKED</option>

                <option value="LT5">LT5</option>
                <option value="HT5">HT5</option>

                <option value="LT4">LT4</option>
                <option value="HT4">HT4</option>

                <option value="LT3">LT3</option>
                <option value="HT3">HT3</option>

                <option value="LT2">LT2</option>
                <option value="HT2">HT2</option>

                <option value="LT1">LT1</option>
                <option value="HT1">HT1</option>

            </select>

            <button id="savePlayer">
                SAVE / UPDATE PLAYER
            </button>

            <button
                id="deletePlayer"
                class="danger"
            >
                DELETE PLAYER
            </button>

            <div id="adminMessage" class="message"></div>

        </div>

        <div class="panel">

            <h2>ALL PLAYERS</h2>

            <div id="adminPlayerList">
                Loading...
            </div>

        </div>

        <div class="panel">

            <button
                id="logoutButton"
                class="gray"
            >
                LOGOUT
            </button>

            <br><br>

            <a href="index.html">
                ← Back to Leaderboard
            </a>

        </div>

    </div>

</div>

<script src="firebase-config.js"></script>
<script src="admin.js"></script>

</body>
</html>
