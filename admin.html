<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SpicyTiers Admin</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

</head>


<body>

<div class="site">

    <header class="topbar">

        <a
            href="index.html"
            class="logo"
        >
            <span>⚡</span> SpicyTiers
        </a>

        <nav>

            <a href="index.html">
                Leaderboard
            </a>

            <a
                href="admin.html"
                class="active"
            >
                Admin
            </a>

        </nav>

    </header>


    <main class="admin-page">


        <!-- LOGIN -->

        <div
            id="loginPanel"
            class="panel login-box"
        >

            <h2>
                ADMIN LOGIN
            </h2>


            <input
                id="email"
                type="email"
                placeholder="Email"
                autocomplete="username"
            >


            <input
                id="password"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
            >


            <button id="loginButton">
                LOGIN
            </button>


            <div
                id="loginMessage"
                class="message"
            ></div>

        </div>


        <!-- DENIED -->

        <div
            id="deniedPanel"
            class="panel"
            style="display:none;"
        >

            <h2>
                ACCESS DENIED
            </h2>

            <p>
                This account is not an administrator.
            </p>

            <br>

            <button
                id="logoutDenied"
                class="gray-btn"
            >
                LOGOUT
            </button>

        </div>


        <!-- ADMIN -->

        <div
            id="adminPanel"
            style="display:none;"
        >

            <div class="admin-title">

                <div class="small-title">
                    ADMINISTRATION
                </div>

                <h1>
                    Player Manager
                </h1>

            </div>


            <!-- EDITOR -->

            <div class="panel">

                <h2>
                    PLAYER EDITOR
                </h2>


                <div class="form-grid">


                    <div class="form-group full">

                        <label>
                            MINECRAFT USERNAME
                        </label>

                        <input
                            id="username"
                            type="text"
                            placeholder="Minecraft Username"
                            maxlength="16"
                            autocomplete="off"
                        >

                    </div>


                    <!-- SWORD -->

                    <div class="form-group">

                        <label>
                            ⚔ SWORD ELO
                        </label>

                        <input
                            id="swordElo"
                            type="number"
                            min="0"
                            value="0"
                        >

                    </div>

                    <div class="form-group">

                        <label>
                            SWORD TIER
                        </label>

                        <select id="swordTier"></select>

                    </div>


                    <!-- AXE -->

                    <div class="form-group">

                        <label>
                            🪓 AXE ELO
                        </label>

                        <input
                            id="axeElo"
                            type="number"
                            min="0"
                            value="0"
                        >

                    </div>

                    <div class="form-group">

                        <label>
                            AXE TIER
                        </label>

                        <select id="axeTier"></select>

                    </div>


                    <!-- VANILLA -->

                    <div class="form-group">

                        <label>
                            VANILLA ELO
                        </label>

                        <input
                            id="vanillaElo"
                            type="number"
                            min="0"
                            value="0"
                        >

                    </div>

                    <div class="form-group">

                        <label>
                            VANILLA TIER
                        </label>

                        <select id="vanillaTier"></select>

                    </div>


                    <!-- UHC -->

                    <div class="form-group">

                        <label>
                            UHC ELO
                        </label>

                        <input
                            id="uhcElo"
                            type="number"
                            min="0"
                            value="0"
                        >

                    </div>

                    <div class="form-group">

                        <label>
                            UHC TIER
                        </label>

                        <select id="uhcTier"></select>

                    </div>


                    <!-- SMP -->

                    <div class="form-group">

                        <label>
                            SMP ELO
                        </label>

                        <input
                            id="smpElo"
                            type="number"
                            min="0"
                            value="0"
                        >

                    </div>

                    <div class="form-group">

                        <label>
                            SMP TIER
                        </label>

                        <select id="smpTier"></select>

                    </div>


                    <!-- NETHERITE OP -->

                    <div class="form-group">

                        <label>
                            NETHERITE OP ELO
                        </label>

                        <input
                            id="netheriteopElo"
                            type="number"
                            min="0"
                            value="0"
                        >

                    </div>

                    <div class="form-group">

                        <label>
                            NETHERITE OP TIER
                        </label>

                        <select id="netheriteopTier"></select>

                    </div>


                    <!-- POT -->

                    <div class="form-group">

                        <label>
                            🧪 POT ELO
                        </label>

                        <input
                            id="potElo"
                            type="number"
                            min="0"
                            value="0"
                        >

                    </div>

                    <div class="form-group">

                        <label>
                            POT TIER
                        </label>

                        <select id="potTier"></select>

                    </div>


                    <!-- MACE -->

                    <div class="form-group">

                        <label>
                            🔨 MACE ELO
                        </label>

                        <input
                            id="maceElo"
                            type="number"
                            min="0"
                            value="0"
                        >

                    </div>

                    <div class="form-group">

                        <label>
                            MACE TIER
                        </label>

                        <select id="maceTier"></select>

                    </div>


                </div>


                <div class="admin-buttons">

                    <button
                        id="savePlayer"
                        class="save-btn"
                    >
                        SAVE / UPDATE
                    </button>

                    <button
                        id="deletePlayer"
                        class="delete-btn"
                    >
                        DELETE
                    </button>

                </div>


                <div
                    id="adminMessage"
                    class="message"
                ></div>

            </div>


            <!-- PLAYERS -->

            <div class="panel">

                <h2>
                    ALL PLAYERS
                </h2>

                <div id="adminPlayerList">
                    Loading...
                </div>

            </div>


            <div class="panel">

                <button
                    id="logoutButton"
                    class="gray-btn"
                >
                    LOGOUT
                </button>

                <br><br>

                <a href="index.html">
                    ← Back to Leaderboard
                </a>

            </div>

        </div>

    </main>

</div>


<script src="firebase-config.js"></script>

<script src="admin.js"></script>

</body>
</html>
