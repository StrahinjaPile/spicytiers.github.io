<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Leaderboard — SpicyTiers</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

</head>

<body>

<div class="site">

<header class="topbar">

    <a href="index.html" class="logo">
        <span>⚡</span> SpicyTiers
    </a>

    <nav>
        <a href="index.html">Home</a>
        <a href="leaderboard.html" class="active">Leaderboard</a>
        <a href="rules.html">Rules</a>
        <a href="connect.html">Connect</a>
    </nav>

    <div id="accountArea">
        <a href="connect.html" class="account-button">
            Connect Account
        </a>
    </div>

</header>


<main>

<section class="leaderboard-page">

    <div class="leaderboard-title">

        <div>

            <div class="section-label">
                SPICYTIERS RANKINGS
            </div>

            <h1>
                Global Leaderboard
            </h1>

            <p>
                The best PvP players in SpicyTiers.
            </p>

        </div>


        <div class="search-box">

            <span>⌕</span>

            <input
                id="searchInput"
                type="text"
                placeholder="Search player..."
                autocomplete="off"
            >

        </div>

    </div>


    <div class="mode-selector">

        <button class="mode active" data-mode="sword">
            <strong>⚔</strong>
            <span>Sword</span>
        </button>

        <button class="mode" data-mode="axe">
            <strong>🪓</strong>
            <span>Axe</span>
        </button>

        <button class="mode" data-mode="vanilla">
            <strong>◆</strong>
            <span>Vanilla</span>
        </button>

        <button class="mode" data-mode="uhc">
            <strong>◇</strong>
            <span>UHC</span>
        </button>

        <button class="mode" data-mode="smp">
            <strong>✦</strong>
            <span>SMP</span>
        </button>

        <button class="mode" data-mode="netheriteop">
            <strong>⬟</strong>
            <span>Netherite OP</span>
        </button>

        <button class="mode" data-mode="pot">
            <strong>♜</strong>
            <span>Pot</span>
        </button>

        <button class="mode" data-mode="mace">
            <strong>◆</strong>
            <span>Mace</span>
        </button>

    </div>


    <div class="leaderboard-card">

        <div class="leaderboard-head">

            <span>RANK</span>
            <span>PLAYER</span>
            <span>TIER</span>
            <span>ELO</span>

        </div>

        <div id="leaderboardList">

            <div class="loading">
                Loading leaderboard...
            </div>

        </div>

    </div>

</section>

</main>


<footer>

    <div class="footer-brand">
        ⚡ SpicyTiers
    </div>

    <div class="footer-links">
        <a href="faq.html">FAQ</a>
        <a href="about.html">About Us</a>
        <a href="rules.html">Rules</a>
        <a href="terms.html">Terms Of Service</a>
    </div>

</footer>

</div>


<script src="firebase-config.js"></script>
<script src="app.js"></script>

</body>
</html>
