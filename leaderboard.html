<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SpicyTiers - Leaderboard</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- =========================
         TOPBAR
    ========================== -->

    <header class="topbar">

        <div class="topbar-inner">

            <a
                href="index.html"
                class="logo"
            >
                <span class="logo-red">
                    Spicy
                </span>
                <span class="logo-white">
                    Tiers
                </span>
            </a>


            <nav class="nav">

                <a href="index.html">
                    Home
                </a>

                <a href="client.html">
                    Client
                </a>

                <a
                    href="leaderboard.html"
                    class="active"
                >
                    Leaderboard
                </a>

                <a href="rules.html">
                    Rules
                </a>

                <a
                    href="https://discord.gg/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Discord
                </a>

            </nav>

        </div>

    </header>


    <!-- =========================
         HERO
    ========================== -->

    <main>

        <section class="leaderboard-hero">

            <div class="hero-content">

                <div class="hero-label">
                    SPICYTIERS RANKED
                </div>

                <h1>
                    The Leaderboard
                </h1>

                <p>
                    See the best SpicyTiers players
                    and compare their ELO.
                </p>

            </div>

        </section>


        <!-- =========================
             LEADERBOARD
        ========================== -->

        <section class="leaderboard-section">

            <div class="leaderboard-container">

                <!-- TOOLBAR -->

                <div class="leaderboard-toolbar">

                    <div class="search-wrapper">

                        <input
                            id="searchInput"
                            type="text"
                            placeholder="Search player..."
                            autocomplete="off"
                        >

                    </div>


                    <div class="mode-wrapper">

                        <select id="modeSelect">

                            <option value="overall">
                                🏆 Overall
                            </option>

                            <option value="sword">
                                ⚔ Sword
                            </option>

                            <option value="axe">
                                🪓 Axe
                            </option>

                            <option value="mace">
                                🔨 Mace
                            </option>

                            <option value="pot">
                                🧪 Pot
                            </option>

                            <option value="uhc">
                                ❤ UHC
                            </option>

                            <option value="vanilla">
                                ✦ Vanilla
                            </option>

                            <option value="smp">
                                ⛊ SMP
                            </option>

                            <option value="nethop">
                                ⚔ Netherite OP
                            </option>

                        </select>

                    </div>

                </div>


                <!-- CURRENT MODE -->

                <div class="leaderboard-title">

                    <h2 id="currentModeTitle">
                        Overall
                    </h2>

                </div>


                <!-- TABLE -->

                <div class="leaderboard">

                    <div class="leaderboard-head">

                        <div>
                            Rank
                        </div>

                        <div>
                            Player
                        </div>

                        <div>
                            Tiers
                        </div>

                        <div>
                            ELO
                        </div>

                    </div>


                    <div id="leaderboardList">

                        <div class="leaderboard-loading">
                            Loading leaderboard...
                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <script src="leaderboard.js"></script>

</body>
</html>
