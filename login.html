<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SpicyTiers — Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="site">

<header class="topbar">

    <a href="index.html" class="logo">
        <span>⚡</span> SpicyTiers
    </a>

</header>


<main>

<section class="login-page">

    <div class="login-card">

        <div class="hero-badge">
            SPICYTIERS ACCOUNT
        </div>

        <h1>
            Welcome back.
        </h1>

        <p>
            Sign in to manage your SpicyTiers account.
        </p>


        <button class="google-login">

            <span>G</span>

            Continue with Google

        </button>


        <div class="login-divider">
            <span>OR</span>
        </div>


        <button class="secondary-button">

            Connect Minecraft Account

        </button>


        <div class="login-info">

            Minecraft account connection will allow
            your profile, ELO and tiers to be linked
            to your Minecraft UUID.

        </div>

    </div>

</section>

</main>

</div>

</body>
</html>
