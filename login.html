<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SpicyTiers — Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="login-page">

<div class="login-container">

    <a href="index.html" class="login-logo">
        <span>⚡</span> Spicy<span>Tiers</span>
    </a>


    <div class="login-card">

        <div class="login-icon">
            ⚡
        </div>

        <div class="section-label">
            SPICYTIERS ACCOUNT
        </div>

        <h1>
            Welcome <span>back.</span>
        </h1>

        <p>
            Connect your Minecraft account to access your
            personal statistics and rankings.
        </p>


        <button
            id="minecraftLogin"
            class="minecraft-login"
        >
            <span>◆</span>
            Connect Minecraft Account
        </button>


        <div
            id="loginMessage"
            class="login-message"
        ></div>


        <div class="login-note">
            Minecraft account verification will be handled
            through the SpicyTiers client.
        </div>

    </div>


    <a href="index.html" class="back-home">
        ← Back to SpicyTiers
    </a>

</div>

<script src="auth.js"></script>

</body>
</html>
